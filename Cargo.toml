[package]
name = "vdash"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "vdash"
path = "src/lib.rs"

[[bin]]
name = "vdash"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
getrandom = "0.2"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
rustix = { version = "0.38", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
signal-hook = "0.3"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing", "local-offset"] }
toml = "0.8"
toml_edit = "0.22"
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
